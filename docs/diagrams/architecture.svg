<text class="name" x="358" y="216">ReplayLesson</text>
<text class="sub" x="358" y="240">application layer</text>
<text class="sub" x="358" y="262">checks should_stop</text>
<rect class="svc" x="598" y="184" width="166" height="108" rx="12"/>
<text class="name" x="614" y="216">lab_database</text>
<text class="sub" x="614" y="240">infrastructure</text>
<text class="sub" x="614" y="262">LabDatabase</text>
<rect class="boundary" x="888" y="132" width="264" height="468" rx="14"/>
<text class="tag" x="904" y="160">PostgreSQL 18</text>
